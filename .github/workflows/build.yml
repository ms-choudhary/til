name: Regenerate README and notify site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate README.md
        run: |-
          python build_meta.py > meta.json
          python update_readme.py

      - name: Commit if changed
        run: |
          git config user.name "README-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "docs: regenerate README [skip ci]"
            git push
          fi

      - name: Notify ms-choudhary.github.io to rebuild
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/ms-choudhary/ms-choudhary.github.io/dispatches \
            -d '{"event_type":"til-updated"}'
